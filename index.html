<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cuaderno de cata</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap');
  :root {
    --bg: #1B2420; --panel: #22302A; --paper: #F5F0E4; --paperSoft: #EDE6D4;
    --ink: #2A2117; --inkSoft: #5C5142; --cream: #EFE7D8;
    --amber: #C89A3D; --amberDeep: #A87F2E; --moss: #6F8F63; --rosewood: #A0473C; --line: #D8D0BE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Inter', -apple-system, sans-serif; }
  input, textarea, button { font-family: 'Inter', -apple-system, sans-serif; }
  input:focus, textarea:focus { outline: none; border-color: var(--amber) !important; }
  #app { min-height: 100vh; padding: 28px 14px 60px; }
  .wrap { max-width: 540px; margin: 0 auto; }
  .title { text-align: center; margin-bottom: 20px; }
  .title h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 30px; color: var(--cream); margin: 0; }
  .title p { color: #9CA69B; font-size: 13px; margin: 4px 0 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--panel); padding: 4px; border-radius: 10px; }
  .tab { flex: 1; padding: 9px 0; border-radius: 7px; border: none; cursor: pointer; background: transparent; color: #B7C0B5; font-weight: 600; font-size: 13.5px; }
  .tab.active { background: var(--amber); color: var(--ink); }
  .linkbtn { font-size: 12px; color: #9CA69B; background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }
  .banner { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: #3A2420; color: #E8C4BC; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .banner.ok { background: #24352C; color: #B7D3C1; }
  .banner button { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
  .card { background: var(--paper); border-radius: 14px; padding: 20px 18px 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; letter-spacing: .02em; color: var(--inkSoft); margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field input[type=password] {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; font-size: 14.5px; color: var(--ink);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--inkSoft); font-size: 12.5px; cursor: pointer; }
  .chip.selected { background: var(--moss); border-color: var(--moss); color: #fff; }
  .chip.amberChip.selected { background: var(--amberDeep); border-color: var(--amberDeep); }
  .hr { height: 1px; background: var(--line); margin: 16px 0; }
  .rating-row { margin-bottom: 18px; }
  .rating-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; }
  .rating-head > div:first-child { flex: 1; min-width: 0; }
  .rating-title { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .rating-hint { font-size: 11.5px; color: var(--inkSoft); }
  .stars { display: flex; gap: 2px; flex-wrap: nowrap; flex-shrink: 0; }
  .stars button { background: none; border: none; padding: 3px; cursor: pointer; line-height: 0; flex-shrink: 0; }
  .stars svg { display: block; }
  .comment-input { width: 100%; padding: 7px 10px; font-size: 13px; margin-top: 4px; border-radius: 8px; border: 1px solid var(--line); }
  .photos-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .thumb { position: relative; flex-shrink: 0; }
  .thumb img { width: 68px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .thumb .rm { position: absolute; top: -6px; right: -6px; background: var(--rosewood); border-radius: 50%; border: 2px solid #fff; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 11px; }
  .addphoto { width: 68px; height: 68px; flex-shrink: 0; border-radius: 8px; border: 1.5px dashed var(--line); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--inkSoft); font-size: 10px; }
  .aibtn { margin-top: 10px; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: none; background: var(--moss); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .aibtn:disabled { background: #B7A98A; cursor: default; }
  .aibox { margin-top: 10px; background: var(--paperSoft); border-radius: 10px; padding: 12px; font-size: 13px; color: var(--ink); line-height: 1.5; }
  .savebtn { width: 100%; padding: 13px 0; border-radius: 9px; border: none; background: var(--ink); color: var(--cream); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .savebtn:disabled { opacity: .6; }
  .empty { background: var(--paper); border-radius: 14px; padding: 40px 20px; text-align: center; color: var(--inkSoft); }
  .sortrow { display: flex; gap: 8px; margin-bottom: 12px; justify-content: flex-end; }
  .sortbtn { font-size: 12px; padding: 5px 11px; border-radius: 999px; cursor: pointer; border: 1px solid #3E4A43; background: transparent; color: #B7C0B5; font-weight: 600; }
  .sortbtn.active { border-color: var(--amber); background: var(--amber); color: var(--ink); }
  .entry { background: var(--paper); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .entry-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; background: none; border: none; cursor: pointer; text-align: left; }
  .entry-head img { width: 42px; height: 42px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
  .entry-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-sub { font-size: 12px; color: var(--inkSoft); }
  .entry-score { display: flex; align-items: center; gap: 4px; flex-shrink: 0; font-weight: 700; color: var(--ink); font-size: 14.5px; }
  .entry-body { padding: 0 14px 16px; }
  .entry-photos { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 12px; }
  .entry-photos img { width: 60px; height: 60px; object-fit: cover; border-radius: 7px; flex-shrink: 0; }
  .meta { font-size: 12.5px; color: var(--inkSoft); margin-bottom: 10px; line-height: 1.6; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: transparent; }
  .btn-edit { border: 1px solid var(--line); color: var(--inkSoft); }
  .btn-del { border: 1px solid var(--rosewood); color: var(--rosewood); }
  .catrow { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink); }
  .settings-panel, .backup-panel { background: var(--panel); border-radius: 10px; padding: 12px; margin-top: 8px; color: #B7C0B5; font-size: 12px; }
  .settings-panel input, .backup-panel textarea { width: 100%; box-sizing: border-box; }
  textarea.mono { font-family: monospace; font-size: 10.5px; height: 60px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const CATEGORIES = [
    { key: 'aromaSeco', label: 'Aroma seco', hint: 'Olor de las hojas antes de infusionar' },
    { key: 'aromaTaza', label: 'Aroma en taza', hint: 'Olor una vez infusionado' },
    { key: 'color', label: 'Color de la infusión', hint: 'Intensidad y tono', hasColorTags: true },
    { key: 'saborCuerpo', label: 'Sabor y cuerpo', hint: 'Qué tan lleno o ligero se siente en boca' },
    { key: 'dulzor', label: 'Dulzor', hint: '' },
    { key: 'amargor', label: 'Amargor', hint: '5 = justo a tu gusto, 1 = te desagradó (no es "cuánto amargor hay")' },
    { key: 'astringencia', label: 'Astringencia', hint: '5 = bien integrada, 1 = molesta o excesiva (no es "cuánta hay")' },
    { key: 'persistencia', label: 'Persistencia', hint: 'Retrogusto: cuánto dura el sabor' },
    { key: 'equilibrio', label: 'Equilibrio general', hint: 'Qué tan bien combinan los sabores' },
    { key: 'calidadHoja', label: 'Calidad de la hoja', hint: 'Hojas rotas, polvo, mezcla pareja' },
  ];
  const FORMAT_OPTIONS = ['Bolsita', 'Hoja suelta / entera', 'Perlas', 'Polvo (ej. matcha)', 'Comprimido / prensado', 'Pirámide', 'Otro'];
  const COLOR_OPTIONS = ['Transparente', 'Amarillo pálido', 'Amarillo dorado', 'Ámbar / naranja', 'Cobrizo / rojizo', 'Marrón claro', 'Marrón oscuro', 'Verde', 'Verde oscuro / oliva', 'Rosado / rojo'];
  const AI_PROMPT = `Eres un catador de té experto. Te muestro una o más fotos que pueden incluir el empaque/caja del producto, las hojas secas y/o la infusión ya preparada en la taza.

Responde ÚNICAMENTE con un objeto JSON (sin texto antes ni después, sin backticks de markdown) con exactamente estas claves:
{
  "brand": string o null,
  "type": string o null (tipo de té: verde, negro, oolong, blanco, pu-erh, rooibos, infusión de hierbas, etc.),
  "origin": string o null,
  "formatGuess": uno exacto de "Bolsita", "Hoja suelta / entera", "Perlas", "Polvo (ej. matcha)", "Comprimido / prensado", "Pirámide", "Otro", o null,
  "dryLeafEvaluation": string o null (1-2 frases sobre el aspecto de la hoja seca, solo si es visible),
  "infusionEvaluation": string o null (1-2 frases sobre el color y aspecto de la infusión, solo si es visible),
  "confidence": número entre 0 y 1
}
Si algo no es visible o no puedes inferirlo con razonable certeza, usa null. No inventes datos.`;

  const STAR_SVG = (filled) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="${filled ? '#C89A3D' : 'none'}" stroke="${filled ? '#C89A3D' : '#C4BBA6'}" stroke-width="1.4"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>`;
  const STAR_SVG_SM = (filled) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="${filled ? '#C89A3D' : 'none'}" stroke="${filled ? '#C89A3D' : '#C4BBA6'}" stroke-width="1.4"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>`;

  function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 9); }
  function esc(s) { return (s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function emptyForm() {
    return {
      id: null, createdAt: null,
      textDefaults: { name: '', brand: '', origin: '', type: '', notes: '' },
      format: [], images: [], colorTags: [],
      ratings: Object.fromEntries(CATEGORIES.map((c) => [c.key, { stars: 0 }])),
      commentDefaults: Object.fromEntries(CATEGORIES.map((c) => [c.key, ''])),
    };
  }

  function overallScore(ratings) {
    const vals = Object.values(ratings).map((r) => r.stars).filter((s) => s > 0);
    if (!vals.length) return 0;
    return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
  }

  function resizeImageFile(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('No se pudo leer la imagen'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
  }

  async function analyzeWithAI(dataUrls, apiKey) {
    const content = dataUrls.map((d) => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: d.split(',')[1] } }));
    content.push({ type: 'text', text: AI_PROMPT });
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model: 'claude-sonnet-5', max_tokens: 1000, messages: [{ role: 'user', content }] }),
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || 'Error de API');
    const textBlock = (data.content || []).find((b) => b.type === 'text');
    if (!textBlock) throw new Error('Sin respuesta de texto');
    const cleaned = textBlock.text.replace(/```json|```/g, '').trim();
    return JSON.parse(cleaned);
  }

  // ---------- State ----------
  let state = {
    view: 'new',
    entries: [],
    form: emptyForm(),
    aiLoading: false,
    aiSuggestion: null,
    aiError: null,
    expandedId: null,
    sortMode: 'recent',
    nameError: false,
    settingsOpen: false,
    backupOpen: false,
    apiKey: '',
    saving: false,
    saveError: null,
    storageWarning: null,
  };

  function loadAll() {
    try { state.entries = JSON.parse(localStorage.getItem('tea-entries') || '[]'); } catch (e) { state.entries = []; }
    state.apiKey = localStorage.getItem('tea-api-key') || '';
  }

  function persistEntries() {
    try {
      localStorage.setItem('tea-entries', JSON.stringify(state.entries));
      state.saveError = null;
    } catch (e) {
      state.saveError = 'No se pudo guardar: el almacenamiento local está lleno. Borra fotos o catas antiguas e intenta de nuevo.';
    }
  }

  function setState(patch) { Object.assign(state, patch); render(); }

  function syncFormTextFromDom() {
    const map = [['f-name', 'name'], ['f-brand', 'brand'], ['f-origin', 'origin'], ['f-type', 'type'], ['f-notes', 'notes']];
    map.forEach(([id, key]) => {
      const el = document.getElementById(id);
      if (el) state.form.textDefaults[key] = el.value;
    });
    CATEGORIES.forEach((c) => {
      const el = document.getElementById('f-comment-' + c.key);
      if (el) state.form.commentDefaults[c.key] = el.value;
    });
  }

  // ---------- Actions (exposed on window for inline handlers via delegation) ----------
  function switchView(v) {
    if (v === 'new') { state.form = emptyForm(); state.aiSuggestion = null; state.aiError = null; state.nameError = false; }
    setState({ view: v });
  }

  function toggleFormat(val) {
    const f = state.form.format;
    state.form.format = f.includes(val) ? f.filter((x) => x !== val) : [...f, val];
    render();
  }
  function toggleColorTag(val) {
    const f = state.form.colorTags;
    state.form.colorTags = f.includes(val) ? f.filter((x) => x !== val) : [...f, val];
    render();
  }
  function setStar(catKey, n) {
    const cur = state.form.ratings[catKey].stars;
    state.form.ratings[catKey].stars = (n === cur) ? 0 : n;
    render();
  }

  async function handleFiles(fileList) {
    for (const file of Array.from(fileList)) {
      try {
        const dataUrl = await resizeImageFile(file, 640, 0.55);
        state.form.images.push({ id: genId(), dataUrl });
        render();
      } catch (e) { /* se ignora archivo que falla */ }
    }
  }
  function removeImage(id) {
    state.form.images = state.form.images.filter((i) => i.id !== id);
    render();
  }

  async function runAiAnalysis() {
    if (!state.form.images.length) return;
    if (!state.apiKey) { setState({ settingsOpen: true }); return; }
    state.aiLoading = true; state.aiError = null; render();
    try {
      const result = await analyzeWithAI(state.form.images.map((i) => i.dataUrl), state.apiKey);
      state.aiSuggestion = result;
    } catch (e) {
      state.aiError = 'No se pudo analizar las fotos (' + (e.message || 'error desconocido') + ').';
    } finally {
      state.aiLoading = false; render();
    }
  }
  function applyAiSuggestions() {
    const s = state.aiSuggestion; if (!s) return;
    if (s.brand) document.getElementById('f-brand').value = s.brand;
    if (s.origin) document.getElementById('f-origin').value = s.origin;
    if (s.type) document.getElementById('f-type').value = s.type;
    if (s.formatGuess && !state.form.format.includes(s.formatGuess)) state.form.format.push(s.formatGuess);
    render();
  }
  function copyEvalToNotes() {
    const s = state.aiSuggestion; if (!s) return;
    const parts = [s.dryLeafEvaluation, s.infusionEvaluation].filter(Boolean);
    if (!parts.length) return;
    const notesEl = document.getElementById('f-notes');
    notesEl.value = notesEl.value ? notesEl.value + '\n' + parts.join(' ') : parts.join(' ');
  }

  function readFormFromDom() {
    const name = document.getElementById('f-name').value.trim();
    const brand = document.getElementById('f-brand').value.trim();
    const origin = document.getElementById('f-origin').value.trim();
    const type = document.getElementById('f-type').value.trim();
    const notes = document.getElementById('f-notes').value;
    const ratings = {};
    CATEGORIES.forEach((c) => {
      const commentEl = document.getElementById('f-comment-' + c.key);
      ratings[c.key] = { stars: state.form.ratings[c.key].stars, comment: commentEl ? commentEl.value : '' };
    });
    return { name, brand, origin, type, notes, ratings };
  }

  function handleSave() {
    const vals = readFormFromDom();
    if (!vals.name) { setState({ nameError: true }); return; }
    state.saving = true; render();
    const entry = {
      id: state.form.id || genId(),
      createdAt: state.form.id ? state.form.createdAt : new Date().toISOString(),
      name: vals.name, brand: vals.brand, origin: vals.origin, type: vals.type,
      format: state.form.format, images: state.form.images, colorTags: state.form.colorTags,
      ratings: vals.ratings, notes: vals.notes,
      aiAnalysis: state.aiSuggestion,
      overallScore: overallScore(vals.ratings),
    };
    state.entries = state.form.id ? state.entries.map((e) => e.id === state.form.id ? entry : e) : [entry, ...state.entries];
    persistEntries();
    state.saving = false; state.form = emptyForm(); state.aiSuggestion = null; state.aiError = null;
    state.expandedId = entry.id; state.view = 'history';
    render();
  }

  function startEdit(id) {
    const entry = state.entries.find((e) => e.id === id); if (!entry) return;
    state.form = {
      id: entry.id, createdAt: entry.createdAt,
      textDefaults: { name: entry.name, brand: entry.brand, origin: entry.origin, type: entry.type, notes: entry.notes },
      format: [...entry.format], images: entry.images, colorTags: [...entry.colorTags],
      ratings: Object.fromEntries(CATEGORIES.map((c) => [c.key, { stars: entry.ratings[c.key]?.stars || 0 }])),
      commentDefaults: Object.fromEntries(CATEGORIES.map((c) => [c.key, entry.ratings[c.key]?.comment || ''])),
    };
    state.aiSuggestion = entry.aiAnalysis || null;
    state.view = 'new'; render();
  }
  function deleteEntry(id) {
    if (!confirm('¿Eliminar esta cata?')) return;
    state.entries = state.entries.filter((e) => e.id !== id);
    persistEntries(); render();
  }
  function toggleExpand(id) { state.expandedId = state.expandedId === id ? null : id; render(); }
  function setSort(mode) { setState({ sortMode: mode }); }

  function saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    state.apiKey = key;
    localStorage.setItem('tea-api-key', key);
    setState({ settingsOpen: false });
  }
  function clearApiKey() {
    state.apiKey = ''; localStorage.removeItem('tea-api-key');
    setState({ settingsOpen: false });
  }

  function copyBackup() {
    const text = JSON.stringify(state.entries);
    const ta = document.getElementById('backup-export');
    if (ta) { ta.value = text; ta.focus(); ta.select(); }
    navigator.clipboard?.writeText(text).then(() => {
      document.getElementById('copy-msg').textContent = 'Copiado al portapapeles.';
    }).catch(() => {
      document.getElementById('copy-msg').textContent = 'Selecciona el texto de abajo y cópialo manualmente.';
    });
  }
  function handleImport() {
    const text = document.getElementById('backup-import').value;
    try {
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed)) throw new Error('formato inválido');
      state.entries = parsed;
      persistEntries();
      document.getElementById('import-msg').textContent = 'Catas restauradas.';
      render();
    } catch (e) {
      document.getElementById('import-msg').textContent = 'Ese texto no tiene un formato válido.';
    }
  }

  // ---------- Render ----------
  function render() {
    if (state.view === 'new') syncFormTextFromDom();
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="wrap">
        <div class="title"><h1>Cuaderno de cata</h1><p>Evalúa y compara tés de distintas marcas</p></div>
        <div class="tabs">
          <button class="tab ${state.view === 'new' ? 'active' : ''}" data-action="switchView" data-val="new">Nueva cata</button>
          <button class="tab ${state.view === 'history' ? 'active' : ''}" data-action="switchView" data-val="history">Historial (${state.entries.length})</button>
        </div>

        ${state.saveError ? `<div class="banner"><span>⚠️ ${esc(state.saveError)}</span></div>` : ''}

        <button class="linkbtn" data-action="toggleSettings">${state.settingsOpen ? 'Ocultar configuración' : '⚙ Configuración (clave de API)'}</button>
        ${state.settingsOpen ? renderSettings() : ''}

        <div style="margin-top:8px;">
        <button class="linkbtn" data-action="toggleBackup">${state.backupOpen ? 'Ocultar respaldo manual' : 'Respaldo manual (exportar / importar catas)'}</button>
        </div>
        ${state.backupOpen ? renderBackup() : ''}

        <div style="height:14px"></div>

        ${state.view === 'new' ? renderForm() : renderHistory()}
      </div>
    `;
    attachDynamicListeners();
  }

  function renderSettings() {
    return `
      <div class="settings-panel">
        <div style="margin-bottom:8px;">Tu clave de API de Anthropic se guarda solo en este teléfono (localStorage) y solo se usa para llamar directamente a la API cuando analizas fotos. Nunca se envía a ningún otro lado.</div>
        <input type="password" id="api-key-input" placeholder="sk-ant-..." value="${esc(state.apiKey)}" style="margin-bottom:8px;">
        <div style="display:flex; gap:8px;">
          <button data-action="saveApiKey" style="font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px; border:none; background:var(--amber); color:var(--ink); cursor:pointer;">Guardar clave</button>
          <button data-action="clearApiKey" style="font-size:12px; padding:6px 12px; border-radius:7px; border:1px solid #3E4A43; background:transparent; color:#B7C0B5; cursor:pointer;">Quitar clave</button>
        </div>
      </div>`;
  }

  function renderBackup() {
    return `
      <div class="backup-panel">
        <div style="margin-bottom:8px;">Copia este texto y guárdalo en otro lugar (ej. Notas) como respaldo extra, o pégalo aquí para restaurar catas.</div>
        <button data-action="copyBackup" style="font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px; border:none; background:var(--amber); color:var(--ink); cursor:pointer; margin-bottom:8px;">Copiar respaldo (${state.entries.length})</button>
        <div id="copy-msg" style="font-size:11.5px; margin-bottom:8px;"></div>
        <textarea id="backup-export" class="mono" readonly>${esc(JSON.stringify(state.entries))}</textarea>
        <div class="hr" style="background:#3E4A43; margin:10px 0;"></div>
        <div style="margin-bottom:6px;">Restaurar desde un respaldo pegado:</div>
        <textarea id="backup-import" class="mono" placeholder="Pega aquí..."></textarea>
        <button data-action="handleImport" style="font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:transparent; color:#EFE7D8; cursor:pointer; margin-top:8px;">Restaurar</button>
        <div id="import-msg" style="font-size:11.5px; margin-top:8px;"></div>
      </div>`;
  }

  function renderForm() {
    const f = state.form;
    return `
      <div class="card">
        ${f.id ? `<div style="font-size:12.5px; color:var(--amberDeep); font-weight:600; margin-bottom:10px;">Editando cata existente</div>` : ''}

        <div class="field">
          <label>NOMBRE DEL TÉ *</label>
          <input type="text" id="f-name" value="${esc(f.textDefaults.name)}" placeholder="Ej. Sencha primavera" style="${state.nameError ? 'border-color:var(--rosewood);' : ''}">
          ${state.nameError ? `<div style="color:var(--rosewood); font-size:12px; margin-top:4px;">Ponle un nombre a esta cata para poder guardarla.</div>` : ''}
        </div>

        <div class="field">
          <label>FOTOS (CAJA, HOJA, INFUSIÓN)</label>
          <div class="photos-row">
            ${f.images.map((img) => `
              <div class="thumb">
                <img src="${img.dataUrl}">
                <div class="rm" data-action="removeImage" data-val="${img.id}">✕</div>
              </div>`).join('')}
            <label class="addphoto">
              📷<span>Agregar</span>
              <input type="file" accept="image/*" multiple style="display:none" id="file-input">
            </label>
          </div>
          ${f.images.length ? `
            <button class="aibtn" data-action="runAiAnalysis" ${state.aiLoading ? 'disabled' : ''}>
              ${state.aiLoading ? '<span class="spin">⏳</span> Analizando fotos...' : '✨ Analizar con IA'}
            </button>` : ''}
          ${!state.apiKey && f.images.length ? `<div style="font-size:11.5px; color:var(--inkSoft); margin-top:6px;">Necesitas agregar tu clave de API en "Configuración" para usar esta función.</div>` : ''}
          ${state.aiError ? `<div style="color:var(--rosewood); font-size:12.5px; margin-top:8px;">${esc(state.aiError)}</div>` : ''}
          ${state.aiSuggestion ? renderAiBox(state.aiSuggestion) : ''}
        </div>

        <div class="grid2">
          <div class="field"><label>MARCA</label><input type="text" id="f-brand" value="${esc(f.textDefaults.brand)}" placeholder="Ej. Numi"></div>
          <div class="field"><label>ORIGEN / LUGAR</label><input type="text" id="f-origin" value="${esc(f.textDefaults.origin)}" placeholder="Ej. Japón"></div>
        </div>
        <div class="field"><label>TIPO DE TÉ</label><input type="text" id="f-type" value="${esc(f.textDefaults.type)}" placeholder="Ej. Verde, negro, oolong..."></div>

        <div class="field">
          <label>FORMATO</label>
          <div class="chips">
            ${FORMAT_OPTIONS.map((opt) => `<button class="chip amberChip ${f.format.includes(opt) ? 'selected' : ''}" data-action="toggleFormat" data-val="${esc(opt)}">${esc(opt)}</button>`).join('')}
          </div>
        </div>

        <div class="hr"></div>
        <div style="font-size:11.5px; color:var(--inkSoft); margin:-8px 0 14px; line-height:1.5;">Las estrellas siempre miden qué tanto te gustó ese aspecto (5 = te encantó, 1 = no te gustó) — no la cantidad o intensidad presente.</div>

        ${CATEGORIES.map((cat) => `
          <div class="rating-row">
            <div class="rating-head">
              <div><div class="rating-title">${cat.label}</div>${cat.hint ? `<div class="rating-hint">${cat.hint}</div>` : ''}</div>
              <div class="stars">
                ${[1,2,3,4,5].map((n) => `<button data-action="setStar" data-cat="${cat.key}" data-n="${n}">${STAR_SVG(n <= f.ratings[cat.key].stars)}</button>`).join('')}
              </div>
            </div>
            ${cat.hasColorTags ? `<div class="chips" style="margin:8px 0;">${COLOR_OPTIONS.map((opt) => `<button class="chip ${f.colorTags.includes(opt) ? 'selected' : ''}" data-action="toggleColorTag" data-val="${esc(opt)}">${esc(opt)}</button>`).join('')}</div>` : ''}
            <input type="text" class="comment-input" id="f-comment-${cat.key}" value="${esc(f.commentDefaults[cat.key])}" placeholder="Comentario (opcional)">
          </div>
        `).join('')}

        <div class="hr"></div>
        <div class="field"><label>NOTAS GENERALES</label><textarea id="f-notes" rows="3" placeholder="Impresión general, con qué lo tomarías, si lo comprarías de nuevo...">${esc(f.textDefaults.notes)}</textarea></div>

        <button class="savebtn" data-action="handleSave" ${state.saving ? 'disabled' : ''}>${state.saving ? 'Guardando...' : (f.id ? 'Guardar cambios' : 'Guardar cata')}</button>
      </div>
    `;
  }

  function renderAiBox(s) {
    return `
      <div class="aibox">
        <div style="font-weight:600; margin-bottom:6px;">✨ Sugerencia de la IA ${typeof s.confidence === 'number' ? `<span style="font-weight:400; color:var(--inkSoft); font-size:11.5px;">· confianza ${Math.round(s.confidence*100)}%</span>` : ''}</div>
        ${s.brand ? `<div><b>Marca:</b> ${esc(s.brand)}</div>` : ''}
        ${s.type ? `<div><b>Tipo:</b> ${esc(s.type)}</div>` : ''}
        ${s.origin ? `<div><b>Origen:</b> ${esc(s.origin)}</div>` : ''}
        ${s.formatGuess ? `<div><b>Formato:</b> ${esc(s.formatGuess)}</div>` : ''}
        ${s.dryLeafEvaluation ? `<div style="margin-top:4px;"><b>Hoja seca:</b> ${esc(s.dryLeafEvaluation)}</div>` : ''}
        ${s.infusionEvaluation ? `<div><b>Infusión:</b> ${esc(s.infusionEvaluation)}</div>` : ''}
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button data-action="applyAiSuggestions" style="font-size:12px; padding:6px 11px; border-radius:7px; border:none; background:var(--amber); color:var(--ink); font-weight:600; cursor:pointer;">Aplicar a los campos</button>
          <button data-action="copyEvalToNotes" style="font-size:12px; padding:6px 11px; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--inkSoft); cursor:pointer;">Copiar a notas</button>
        </div>
      </div>`;
  }

  function renderHistory() {
    if (!state.entries.length) {
      return `<div class="empty">Todavía no has guardado ninguna cata. Ve a "Nueva cata" para empezar a evaluar tés.</div>`;
    }
    const sorted = [...state.entries].sort((a, b) => state.sortMode === 'score' ? b.overallScore - a.overallScore : new Date(b.createdAt) - new Date(a.createdAt));
    return `
      <div class="sortrow">
        <button class="sortbtn ${state.sortMode === 'recent' ? 'active' : ''}" data-action="setSort" data-val="recent">Recientes</button>
        <button class="sortbtn ${state.sortMode === 'score' ? 'active' : ''}" data-action="setSort" data-val="score">Mejor puntuadas</button>
      </div>
      ${sorted.map((entry) => renderEntry(entry)).join('')}
    `;
  }

  function renderEntry(entry) {
    const isOpen = state.expandedId === entry.id;
    return `
      <div class="entry">
        <button class="entry-head" data-action="toggleExpand" data-val="${entry.id}">
          ${entry.images[0] ? `<img src="${entry.images[0].dataUrl}">` : ''}
          <div style="flex:1; min-width:0;">
            <div class="entry-title">${esc(entry.name)}</div>
            <div class="entry-sub">${esc([entry.brand, entry.type].filter(Boolean).join(' · ') || 'Sin marca/tipo')}</div>
          </div>
          <div class="entry-score">${STAR_SVG_SM(true)} ${entry.overallScore || '–'}</div>
          <div>${isOpen ? '▲' : '▼'}</div>
        </button>
        ${isOpen ? renderEntryBody(entry) : ''}
      </div>`;
  }

  function renderEntryBody(entry) {
    return `
      <div class="entry-body">
        <div class="hr" style="margin:0 0 12px;"></div>
        ${entry.images.length ? `<div class="entry-photos">${entry.images.map((img) => `<img src="${img.dataUrl}">`).join('')}</div>` : ''}
        <div class="meta">
          ${entry.origin ? `<div><b>Origen:</b> ${esc(entry.origin)}</div>` : ''}
          ${entry.format.length ? `<div><b>Formato:</b> ${esc(entry.format.join(', '))}</div>` : ''}
          <div><b>Fecha:</b> ${new Date(entry.createdAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
        </div>
        ${entry.aiAnalysis && (entry.aiAnalysis.dryLeafEvaluation || entry.aiAnalysis.infusionEvaluation) ? `
          <div class="aibox" style="margin-bottom:12px;">
            <div style="font-weight:600; margin-bottom:4px;">✨ Evaluación de la IA</div>
            ${entry.aiAnalysis.dryLeafEvaluation ? `<div>${esc(entry.aiAnalysis.dryLeafEvaluation)}</div>` : ''}
            ${entry.aiAnalysis.infusionEvaluation ? `<div>${esc(entry.aiAnalysis.infusionEvaluation)}</div>` : ''}
          </div>` : ''}
        ${CATEGORIES.map((cat) => {
          const r = entry.ratings[cat.key] || { stars: 0, comment: '' };
          if (!r.stars && !r.comment) return '';
          return `
            <div class="catrow">
              <div>
                ${cat.label}
                ${r.comment ? `<div style="color:var(--inkSoft); font-size:11.5px;">${esc(r.comment)}</div>` : ''}
                ${cat.hasColorTags && entry.colorTags.length ? `<div style="color:var(--inkSoft); font-size:11.5px;">${esc(entry.colorTags.join(', '))}</div>` : ''}
              </div>
              <div class="stars">${[1,2,3,4,5].map((n) => STAR_SVG_SM(n <= r.stars)).join('')}</div>
            </div>`;
        }).join('')}
        ${entry.notes ? `<div style="margin-top:12px; font-size:12.5px; background:var(--paperSoft); border-radius:8px; padding:10px;">${esc(entry.notes)}</div>` : ''}
        <div class="actions">
          <button class="btn-edit" data-action="startEdit" data-val="${entry.id}">✎ Editar</button>
          <button class="btn-del" data-action="deleteEntry" data-val="${entry.id}">🗑 Eliminar</button>
        </div>
      </div>`;
  }

  function attachDynamicListeners() {
    const fileInput = document.getElementById('file-input');
    if (fileInput) fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
  }

  document.getElementById('app').addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    const val = el.getAttribute('data-val');
    const cat = el.getAttribute('data-cat');
    const n = el.getAttribute('data-n');
    switch (action) {
      case 'switchView': switchView(val); break;
      case 'toggleSettings': setState({ settingsOpen: !state.settingsOpen }); break;
      case 'toggleBackup': setState({ backupOpen: !state.backupOpen }); break;
      case 'saveApiKey': saveApiKey(); break;
      case 'clearApiKey': clearApiKey(); break;
      case 'copyBackup': copyBackup(); break;
      case 'handleImport': handleImport(); break;
      case 'removeImage': removeImage(val); break;
      case 'runAiAnalysis': runAiAnalysis(); break;
      case 'applyAiSuggestions': applyAiSuggestions(); break;
      case 'copyEvalToNotes': copyEvalToNotes(); break;
      case 'toggleFormat': toggleFormat(val); break;
      case 'toggleColorTag': toggleColorTag(val); break;
      case 'setStar': setStar(cat, parseInt(n, 10)); break;
      case 'handleSave': handleSave(); break;
      case 'startEdit': startEdit(val); break;
      case 'deleteEntry': deleteEntry(val); break;
      case 'toggleExpand': toggleExpand(val); break;
      case 'setSort': setSort(val); break;
    }
  });

  loadAll();
  render();
})();
</script>
</body>
</html>
